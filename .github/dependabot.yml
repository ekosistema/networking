version: 2
updates:
  # Dependencias de la web (Astro, Starlight y tipografías)
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
  # Acciones del flujo de despliegue
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
