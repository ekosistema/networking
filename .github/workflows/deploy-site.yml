name: Desplegar sitio

# En un push a main: comprueba, compila, audita y publica.
# En un pull request (por ejemplo, las de Dependabot): solo comprueba, compila y audita; nunca publica.
on:
  push:
    branches: [main]
    paths: ['0*/**', 'README.md', 'site/**', 'scripts/**', 'LICENSE', '.github/workflows/deploy-site.yml']
  pull_request:
    branches: [main]
    paths: ['0*/**', 'README.md', 'site/**', 'scripts/**', 'LICENSE', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

# Permisos mínimos para todo el flujo; la publicación pide los suyos solo en el trabajo de despliegue.
permissions:
  contents: read

# Un grupo por rama: una PR nueva cancela la comprobación anterior de esa misma PR, pero nunca interrumpe
# un despliegue en curso de main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # historial completo: las fechas de última modificación salen de git
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Comprobar contenido
        run: node scripts/check-content.mjs
      - name: Instalar dependencias del sitio
        run: npm ci
        working-directory: site
      - name: Compilar
        run: npm run build
        working-directory: site
        env:
          # Dominio propio (CNAME en site/public): la base queda vacía.
          SITE_URL: https://networking.celerolab.com
      - name: Auditoría SEO y GEO
        run: npm run check:seo
        working-directory: site
        env:
          SITE_URL: https://networking.celerolab.com
      - name: Preparar artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    # Solo en main (push o ejecución manual): una PR, aunque la abra un bot, nunca publica.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
